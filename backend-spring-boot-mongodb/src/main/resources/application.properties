# ===================================================================
# Social Shuffle - Spring Boot & MongoDB Configuration
# Compatible with Spring Tool Suite (STS) 4.x / Eclipse / IntelliJ
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# MongoDB Database Connection
# -------------------------------------------------------------------
# Option 1: Local MongoDB instance
spring.data.mongodb.uri=mongodb://localhost:27017/social_shuffle

# Option 2: MongoDB Atlas Cloud (Uncomment and set your connection string)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.mongodb.net/social_shuffle?retryWrites=true&w=majority

# Auto-index creation in MongoDB
spring.data.mongodb.auto-index-creation=true

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
# Allowed origins for Cross-Origin requests
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
