# ===================================================================
# Social Shuffle - Spring Boot & Supabase PostgreSQL Configuration
# Compatible with Supabase PostgreSQL, Cloud Native, Docker & Local
# ===================================================================

spring.application.name=social-shuffle-backend
server.port=8080

# -------------------------------------------------------------------
# PostgreSQL Database Connection (Supabase IPv4 Pooler & Cloud Ready)
# -------------------------------------------------------------------
# IPv4 Pooler Host: aws-0-ap-southeast-2.pooler.supabase.com:5432 (Session Mode)
# Solves 'java.net.SocketException: Network is unreachable' on IPv4-only platforms like Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${DB_USER:postgres.pngqqlrrqovdkzvljgjc}
spring.datasource.password=${DB_PASSWORD:u7ihNL9yTUg8MnTw}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool: Low Latency, High Concurrency, Zero Leak
spring.datasource.hikari.pool-name=SocialShuffleHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# -------------------------------------------------------------------
# Hibernate / JPA Configuration (PostgreSQL Dialect & Auto Schema Sync)
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Batching inserts & updates to eliminate round-trip network overhead
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# -------------------------------------------------------------------
# Backend API Endpoint & Frontend Integration URLs
# -------------------------------------------------------------------
# Primary backend API endpoint for frontend HTTP/REST calls
app.api.endpoint=${APP_API_ENDPOINT:https://social-shuffle-backend.onrender.com/api}
app.api.base-url=${APP_API_BASE_URL:https://social-shuffle-backend.onrender.com/api}
app.api.public-url=${APP_API_PUBLIC_URL:https://social-shuffle-backend.onrender.com}
backend.api.endpoint=${BACKEND_API_ENDPOINT:https://social-shuffle-backend.onrender.com/api}

# -------------------------------------------------------------------
# CORS Configuration for React Frontend
# -------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://social-shuffle-backend.onrender.com,https://ais-dev-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app,https://ais-pre-teny6sfrvvty3om6s3zo5h-464954934094.asia-southeast1.run.app}

# -------------------------------------------------------------------
# Cryptographic Token & Authentication Security
# -------------------------------------------------------------------
app.security.jwt-secret=${APP_JWT_SECRET:SocialShuffleSuperSecureHMAC256KeyPuneCommunityBoardGames2026!}

# -------------------------------------------------------------------
# Secure Logging (No SQL Parameter or Credential Leaks in Production Logs)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.socialshuffle=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
